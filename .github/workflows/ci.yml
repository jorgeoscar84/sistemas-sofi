name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Pruebas y validación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pruebas del núcleo
        run: npm test

      - name: Autodiagnóstico integral (sin SRI)
        run: npm run autodiagnostico

      - name: Java 17 (validador XMLDSig)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificación de firma XAdES
        run: npm run verify:signature
